name: Build and Release Desktop App (Tauri 2.0)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v2.8.1)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-rrwr
  cancel-in-progress: false

jobs:
  build_release:
    name: Build & Package Desktop Release (Linux x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies (Linux WebKitGTK & Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools \
            libfuse2 \
            rpm

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js for prebuilt Tauri CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: pip install psutil

      - name: Validate Tests & Memory SLA
        run: |
          cargo test
          python3 tests/e2e_runner.py
          python3 .agents/scripts/memory_check.py

      - name: Build Tauri Desktop Bundles
        run: npx tauri build

      - name: Collect Release Artifacts
        id: collect_artifacts
        run: |
          mkdir -p release_assets
          find target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} release_assets/ \;
          mkdir -p release_assets/rrwr-linux-x86_64/usr/bin release_assets/rrwr-linux-x86_64/usr/share/applications release_assets/rrwr-linux-x86_64/usr/share/icons/hicolor/256x256/apps
          install -m 755 target/release/rrwr release_assets/rrwr-linux-x86_64/usr/bin/rrwr
          install -m 644 packaging/linux/rrwr.desktop release_assets/rrwr-linux-x86_64/usr/share/applications/rrwr.desktop
          install -m 644 src-tauri/icons/icon.png release_assets/rrwr-linux-x86_64/usr/share/icons/hicolor/256x256/apps/rrwr.png
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          tar -C release_assets -czf "release_assets/rrwr-${version}-linux-x86_64.tar.gz" rrwr-linux-x86_64
          sha256sum "release_assets/rrwr-${version}-linux-x86_64.tar.gz" > "release_assets/rrwr-${version}-linux-x86_64.tar.gz.sha256"
          rm -rf release_assets/rrwr-linux-x86_64
          ls -la release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
